name: CI

on:
    push:
        branches: [nightly]
    pull_request:
        branches: [nightly]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

jobs:
    check:
        name: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install gpui's Linux libraries
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev
            - name: Install the pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
              with:
                  tool: taplo-cli,typos-cli
            - name: Format
              run: |
                  cargo fmt --all -- --check
                  taplo fmt --check
            - name: Guards
              run: |
                  scripts/check-line-count.sh
                  scripts/check-unsafe.sh
            - name: Typos
              run: typos
            - name: Shell scripts and installer
              if: runner.os != 'Windows'
              run: |
                  command -v shellcheck >/dev/null || brew install shellcheck
                  shellcheck scripts/*.sh .githooks/*
                  scripts/test-install.sh
            - name: Clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - name: Test
              # Every failing test on every OS in one run, not just the first failing crate's.
              run: cargo test --workspace --all-features --no-fail-fast

    deny:
        name: cargo-deny
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
