[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/yuyudhan/quickhop"
publish = false

[workspace.dependencies]
quickhop-core = { path = "crates/quickhop-core" }
quickhop-index = { path = "crates/quickhop-index" }
quickhop-providers = { path = "crates/quickhop-providers" }
quickhop-store = { path = "crates/quickhop-store" }
quickhop-ui = { path = "crates/quickhop-ui" }
assert_cmd = "2"
clap = { version = "4.6", features = ["derive"] }
emojis = "0.9"
fend-core = "1.5"
getrandom = "0.4"
ignore = "0.4"
insta = "1.49"
jiff = "0.2"
notify = "8.2"
nucleo-matcher = "0.3"
percent-encoding = "2.3"
plist = { version = "1.10", default-features = false }
proptest = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
struct_excessive_bools = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
