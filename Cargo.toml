[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/yuyudhan/quickhop"
publish = false

[workspace.dependencies]
quickhop-core = { path = "crates/quickhop-core" }
quickhop-providers = { path = "crates/quickhop-providers" }
quickhop-ui = { path = "crates/quickhop-ui" }
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
struct_excessive_bools = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
