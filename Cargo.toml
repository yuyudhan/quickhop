[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# The oldest Rust that builds the whole tree: the pinned gpui revision uses
# `Option::map_or_default` (stable in 1.98). `cargo install --git` ignores rust-toolchain.toml,
# so this is what tells an older toolchain to update instead of failing inside gpui.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuyudhan/quickhop"
publish = false

[workspace.dependencies]
quickhop-core = { path = "crates/quickhop-core" }
quickhop-index = { path = "crates/quickhop-index" }
quickhop-platform-linux = { path = "crates/quickhop-platform-linux" }
quickhop-platform-macos = { path = "crates/quickhop-platform-macos" }
quickhop-providers = { path = "crates/quickhop-providers" }
quickhop-store = { path = "crates/quickhop-store" }
quickhop-ui = { path = "crates/quickhop-ui" }
assert_cmd = "2"
async-channel = "2.5"
clap = { version = "4.6", features = ["derive"] }
emojis = "0.9"
fend-core = "1.5"
getrandom = "0.4"
# gpui is pinned to one reviewed Zed revision (ADR 0001); move the pin deliberately.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ec237216460f8a34a4ac7c6b068e838593976ede" }
# `runtime_shaders` compiles the Metal shaders at start-up, so macOS builds need only the
# Command Line Tools, not Xcode's `metal` compiler.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ec237216460f8a34a4ac7c6b068e838593976ede", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
ignore = "0.4"
# The Linux tray icon (StatusNotifierItem over D-Bus), on the blocking API without tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
insta = "1.49"
jiff = "0.2"
notify = "8.2"
nucleo-matcher = "0.3"
# AppKit bindings for quickhop-platform-macos, at the versions gpui's tree already uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2.3"
plist = { version = "1.10", default-features = false }
png = "0.18"
# The AppKit view behind a gpui window, for quickhop-platform-macos (gpui's version).
raw-window-handle = "0.6"
proptest = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.2"
# Writes the settings window's changes into config.toml, keeping the user's comments and order.
toml_edit = "0.25"
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
struct_excessive_bools = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
