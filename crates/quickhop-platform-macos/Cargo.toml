[package]
name = "quickhop-platform-macos"
description = "quickhop's macOS FFI (AppKit): the only crate besides quickhop-platform-linux allowed to use unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
quickhop-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-application-services = { workspace = true, features = [
    "AXError",
    "AXUIElement",
    "HIServices",
    "libc",
] }
objc2-app-kit = { workspace = true, features = [
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
    "objc2-core-graphics",
] }
objc2-core-foundation = { workspace = true, features = [
    "CFArray",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { workspace = true, features = [
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGRemoteOperation",
    "CGWindow",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSString",
] }

[dev-dependencies]
png.workspace = true
quickhop-store.workspace = true

# The workspace lints, except that unsafe code is allowed here: it is how this crate calls
# AppKit. The crate root denies `unsafe_op_in_unsafe_fn` and undocumented unsafe blocks, and
# `scripts/check-unsafe.sh` checks that it does.
[lints.rust]
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
struct_excessive_bools = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
