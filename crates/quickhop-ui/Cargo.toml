[package]
name = "quickhop-ui"
description = "The quickhop launcher window, built with gpui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
quickhop-core.workspace = true
serde.workspace = true
thiserror.workspace = true

# The window: macOS first (plan slice U2); Linux joins with its own slice.
[target.'cfg(target_os = "macos")'.dependencies]
async-channel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
quickhop-platform-macos.workspace = true

[dev-dependencies]
# The toolkit spike (examples/spike.rs, plan slice U0) measures gpui before the window code
# depends on it.
async-channel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
proptest.workspace = true

[[example]]
name = "spike"
# Its unit tests (highlight ranges, percentiles, fake data) run with `cargo test`.
test = true

# gpui's macOS platform starts only on the main thread, which libtest keeps for itself.
[[test]]
name = "onboarding_layout"
harness = false

[lints]
workspace = true
