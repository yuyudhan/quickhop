[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
# The workspace crates are unpublished and the project licence is not yet chosen.
private = { ignore = true }
# nucleo-matcher (Helix's fuzzy matcher, the ranking engine picked in the T90 design) is
# MPL-2.0 only. MPL-2.0 is file-level copyleft: using it unmodified as a dependency puts no
# obligation on quickhop's own files. notify (the file-index watcher: inotify, FSEvents) is
# CC0-1.0, a public-domain dedication with no conditions. Allowed for these crates only, not
# policy-wide.
exceptions = [
    { crate = "nucleo-matcher", allow = [
        "MPL-2.0",
    ] },
    { crate = "notify", allow = [
        "CC0-1.0",
    ] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
