[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates inside gpui's tree (ADR 0001) with no maintained release to move to;
# they leave when the gpui pin moves past them.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, gpui's font parsing" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, text shaping in gpui's SVG renderer (usvg)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, gpui's Linux accessibility and portals (zbus)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, gpui's Linux accessibility and portals (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, gpui's Linux accessibility and portals (zbus)" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
# The workspace crates (MIT OR Apache-2.0) are unpublished, so cargo-deny skips their own licence.
private = { ignore = true }
# nucleo-matcher (Helix's fuzzy matcher, the ranking engine picked in the T90 design) is
# MPL-2.0 only. MPL-2.0 is file-level copyleft: using it unmodified as a dependency puts no
# obligation on quickhop's own files. notify (the file-index watcher: inotify, FSEvents) is
# CC0-1.0, a public-domain dedication with no conditions. The others come with gpui, a normal
# dependency since the launcher window (ADR 0001), unmodified, on the same terms: cbindgen
# (MPL-2.0) only runs in gpui_apple's build script; dwrote (MPL-2.0, DirectWrite) and
# option-ext (MPL-2.0, through dirs) are font-kit's; tiny-keccak (CC0-1.0) runs inside the
# const-random proc-macro behind zed-xim's ahash. Allowed for these crates only, not
# policy-wide.
exceptions = [
    { crate = "nucleo-matcher", allow = [
        "MPL-2.0",
    ] },
    { crate = "notify", allow = [
        "CC0-1.0",
    ] },
    { crate = "cbindgen", allow = [
        "MPL-2.0",
    ] },
    { crate = "dwrote", allow = [
        "MPL-2.0",
    ] },
    { crate = "option-ext", allow = [
        "MPL-2.0",
    ] },
    { crate = "tiny-keccak", allow = [
        "CC0-1.0",
    ] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# gpui's tree (ADR 0001, pinned to one Zed revision) brings its own versions of about thirty
# crates quickhop also uses (objc2 0.5, thiserror 1, toml 0.8, zbus 5, x11rb 0.13, ...), and
# quickhop cannot move them. Duplicates are checked in quickhop's own tree only.
skip-tree = [
    { crate = "gpui", reason = "gpui's dependencies at the pinned Zed revision" },
    { crate = "gpui_platform", reason = "gpui's platform dependencies at the pinned Zed revision" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# gpui is a git dependency pinned to one Zed revision (ADR 0001); these are the git sources its
# tree uses at that revision.
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/zed",
]
